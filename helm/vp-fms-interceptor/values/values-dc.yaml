# Explicit values snapshot for the DC environment, matching the running
# config.toml exactly. Use it with -f:
#
#   helm upgrade --install vp-fms-interceptor vp-fms-interceptor \
#     -n vynamic-payments-maybank \
#     -f vp-fms-interceptor/values/values-dc.yaml \
#     --set globalImageTag=<build>
#
# Everything here is the real running configuration, not a placeholder -- except
# image.repository, which you MUST point at the registry that actually holds the
# image for this cluster (confirm before deploying).

image:
  # The image built and pushed by the Listener_VP Jenkins job to the Nexus
  # registry (build #23 -> repouat.maybank.co.id:8082/vp-fms-interceptor:rust-1.0.0).
  repository: repouat.maybank.co.id:8082/vp-fms-interceptor
  # The tag Jenkins pushed. Override at deploy time with --set globalImageTag=<tag>.
  tag: "rust-1.0.0"
  pullPolicy: IfNotPresent

replicaCount: 1
logLevel: info

config:
  listen:
    addr: "0.0.0.0:9100"
    max_connections: 4096
  upstream:
    addr: "192.168.249.150:11682"
    connect_timeout_ms: 3000
  proxy:
    read_buffer_bytes: 16384
    nodelay: true
    idle_timeout_ms: 0
  tee:
    shards: 4
    queue_capacity: 8192
    publish_directions: both
  framing:
    mode: length_prefix
    prefix_bytes: 2
    big_endian: true
    length_includes_prefix: false
    max_frame_bytes: 65536
  timing:
    enabled: true
    pair_request_response: true
    max_pending: 256
  debug_payload:
    # On, as in the running config. Logs full payload (can include PAN/track2).
    enabled: true
    max_bytes: 65536
  parse:
    mode: none
    pair_delimiter: ","
    kv_delimiter: "="
    trim: true
    max_fields: 64
  kafka:
    enabled: true
    brokers: "10.235.83.34:9092"
    topic: vp.fms.iso8583
    value_format: json
    payload_encoding: base64
    acks: "1"
    compression: lz4
    linger_ms: 5
    message_timeout_ms: 5000
    queue_buffering_max_messages: 100000
    queue_buffering_max_kbytes: 262144
    filterToml: |
      any_of = [
        { all_of = [
            { mti = ["0800", "0810"] },
            { de70 = ["301", "001"] }
          ] }
      ]
    properties: {}
  admin:
    addr: "0.0.0.0:9101"
