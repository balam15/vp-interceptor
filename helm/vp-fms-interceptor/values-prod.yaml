# Production overlay for OpenShift. Layer it on top of values.yaml:
#
#   helm upgrade --install vp-fms-interceptor helm/vp-fms-interceptor \
#     -f helm/vp-fms-interceptor/values.yaml \
#     -f helm/vp-fms-interceptor/values-prod.yaml \
#     --set globalImageTag=<build>
#
# Only the prod plumbing is overridden here. The `config:` section is NOT
# repeated, so prod inherits the running config.toml values from values.yaml
# (FMS and Kafka endpoints). Override any of them per environment at deploy time
# with `--set config.<...>=<value>` or a dedicated values file, rather than
# inventing endpoints here.

image:
  # The OCP internal registry path the cluster pulls from.
  repository: image-registry.openshift-image-registry.svc:5000/vp-listener/vp-fms-interceptor
  pullPolicy: IfNotPresent

# One pod, same as dev -- a second replica does not relieve the existing
# long-lived VP connections.
replicaCount: 1

logLevel: info

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

podDisruptionBudget:
  enabled: false
  minAvailable: 1

autoscaling:
  enabled: false

topologySpreadConstraints: []

service:
  # Keep the unauthenticated admin port off the Service in prod. Reach /metrics
  # with `oc port-forward`, or add a NetworkPolicy and turn this back on for
  # Prometheus.
  exposeAdminPort: false
