apiVersion: v2
name: vp-fms-interceptor
description: VP -> FMS ISO 8583 TCP interceptor that tees traffic to Kafka
type: application

# Bump on every chart change.
version: 1.0.0
# Version of the vp-fms-interceptor binary this chart deploys. Used as the image
# tag when image.tag is empty, so keep it in step with rust-interceptor/Cargo.toml.
appVersion: "0.1.0"

# The objects deployed by default (ConfigMap, Deployment apps/v1, Service,
# ServiceAccount) work on old clusters, so the floor is low. Only the OPTIONAL
# add-ons need newer APIs -- enable them on a matching cluster:
#   autoscaling.enabled      -> HorizontalPodAutoscaler autoscaling/v2 (k8s 1.23+)
#   podDisruptionBudget.enabled -> PodDisruptionBudget policy/v1       (k8s 1.21+)
kubeVersion: ">=1.19.0-0"

keywords:
  - iso8583
  - tcp-proxy
  - kafka
  - openshift
sources:
  - https://github.com/balam15/vp-interceptor
maintainers:
  - name: VP Listener team
