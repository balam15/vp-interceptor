{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "vp-fms-interceptor.fullname" . }}
  labels:
    {{- include "vp-fms-interceptor.labels" . | nindent 4 }}
spec:
  # Keeps a node drain or a cluster upgrade from taking every replica at once.
  # Must stay strictly below the replica count or evictions block forever and the
  # drain hangs -- the chart's validate helper enforces that against replicaCount
  # (or autoscaling.minReplicas when an HPA owns the count). Disabled by default
  # because this chart ships one replica, where no value is valid.
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "vp-fms-interceptor.selectorLabels" . | nindent 6 }}
{{- end }}
