{{- include "vp-fms-interceptor.validate" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vp-fms-interceptor.fullname" . }}-config
  labels:
    {{- include "vp-fms-interceptor.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Mounted at /etc/vp-fms/config.toml and passed as argv[1]. A Secret rather
  # than a ConfigMap because [kafka.properties] is the only place SASL/TLS
  # credentials can live, and the binary reads exactly one file.
  config.toml: |
    {{- include "vp-fms-interceptor.configToml" . | nindent 4 }}
