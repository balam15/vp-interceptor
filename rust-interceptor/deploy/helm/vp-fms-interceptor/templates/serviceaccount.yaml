{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vp-fms-interceptor.serviceAccountName" . }}
  labels:
    {{- include "vp-fms-interceptor.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# No Role or RoleBinding: the process makes no Kubernetes API calls. It exists
# only so the pods are not sharing the namespace default ServiceAccount.
automountServiceAccountToken: false
{{- end }}
