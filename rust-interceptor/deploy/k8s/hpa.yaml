---
# Source: vp-fms-interceptor/templates/hpa.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vp-fms-interceptor
  labels:
    helm.sh/chart: vp-fms-interceptor-0.1.0
    app.kubernetes.io/name: vp-fms-interceptor
    app.kubernetes.io/instance: vp-fms-interceptor
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: interceptor
    app.kubernetes.io/part-of: vp-listener
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vp-fms-interceptor
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # Long window on purpose. Scaling in terminates a pod that may still hold
      # open VP connections; those survive the 30s drain but a flapping HPA
      # would churn them repeatedly.
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60

