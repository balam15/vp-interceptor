---
# Source: vp-fms-interceptor/templates/pdb.yaml
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vp-fms-interceptor
  labels:
    helm.sh/chart: vp-fms-interceptor-0.1.0
    app.kubernetes.io/name: vp-fms-interceptor
    app.kubernetes.io/instance: vp-fms-interceptor
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: interceptor
    app.kubernetes.io/part-of: vp-listener
spec:
  # Keeps a node drain or a cluster upgrade from taking every replica at once.
  # Must stay below the replica count or evictions block forever and the drain
  # hangs -- the chart's validate helper enforces that against autoscaling.minReplicas.
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vp-fms-interceptor
      app.kubernetes.io/instance: vp-fms-interceptor

