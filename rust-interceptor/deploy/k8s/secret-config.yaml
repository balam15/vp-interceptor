---
# Source: vp-fms-interceptor/templates/secret-config.yaml
apiVersion: v1
kind: Secret
metadata:
  name: vp-fms-interceptor-config
  labels:
    helm.sh/chart: vp-fms-interceptor-0.1.0
    app.kubernetes.io/name: vp-fms-interceptor
    app.kubernetes.io/instance: vp-fms-interceptor
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: interceptor
    app.kubernetes.io/part-of: vp-listener
type: Opaque
stringData:
  # Mounted at /etc/vp-fms/config.toml and passed as argv[1]. A Secret rather
  # than a ConfigMap because [kafka.properties] is the only place SASL/TLS
  # credentials can live, and the binary reads exactly one file.
  config.toml: |
    # Generated by the vp-fms-interceptor Helm chart -- DO NOT EDIT IN THE CLUSTER.
    # Edit values.yaml and `helm upgrade`; an in-place edit is silently reverted on
    # the next release and does not restart the pods.
    
    [listen]
    addr = "0.0.0.0:9100"
    max_connections = 4096
    
    [upstream]
    addr = "fms.vp-listener.svc.cluster.local:8583"
    connect_timeout_ms = 3000
    
    [proxy]
    read_buffer_bytes = 16384
    nodelay = true
    idle_timeout_ms = 0
    
    [tee]
    shards = 4
    queue_capacity = 8192
    publish_directions = "both"
    
    [framing]
    mode = "length_prefix"
    prefix_bytes = 2
    big_endian = true
    length_includes_prefix = false
    max_frame_bytes = 65536
    
    [timing]
    enabled = true
    pair_request_response = true
    max_pending = 256
    
    [parse]
    mode = "none"
    pair_delimiter = ","
    kv_delimiter = "="
    trim = true
    max_fields = 64
    
    [kafka]
    enabled = true
    brokers = "kafka.vp-listener.svc.cluster.local:9092"
    topic = "vp.fms.iso8583"
    value_format = "json"
    payload_encoding = "base64"
    acks = "1"
    compression = "lz4"
    linger_ms = 5
    message_timeout_ms = 5000
    queue_buffering_max_messages = 100000
    queue_buffering_max_kbytes = 262144
    
    [kafka.properties]
    
    [admin]
    addr = "0.0.0.0:9101"

